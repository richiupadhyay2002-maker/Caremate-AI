# Alembic configuration for Caremate AI
# Run migrations with:  python -m alembic upgrade head
# Generate a new migration:  python -m alembic revision -m "message" --autogenerate

[alembic]
# Path to the directory containing migration scripts
script_location = alembic
# File-based SQLite by default; override via env var in env.py
sqlalchemy.url = sqlite:///caremate.db
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
